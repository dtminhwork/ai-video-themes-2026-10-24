<script>
const rail=document.querySelector('.carousel');
const arrows=document.querySelectorAll('.scroll-arrow');
function updateArrows(){
  arrows[0].disabled=rail.scrollLeft<=2;
  arrows[1].disabled=rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-3;
}
arrows.forEach((button,index)=>button.addEventListener('click',()=>rail.scrollBy({left:(index?1:-1)*rail.clientWidth*.82,behavior:'smooth'})));
rail.addEventListener('scroll',updateArrows,{passive:true});
window.addEventListener('resize',updateArrows);
updateArrows();
const modal=document.getElementById('video-modal');
const player=document.getElementById('modal-video');
const downloadVideo=document.getElementById('download-video');
const previews=[...document.querySelectorAll('.card-preview')];
if('IntersectionObserver' in window){
  const observer=new IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>{
    target.dataset.visible=isIntersecting?'1':'0';
    if(isIntersecting){
      if(!target.src)target.src=target.dataset.src;
      if(!modal.open)target.play().catch(()=>{});
    }else target.pause();
  }),{threshold:.2});
  previews.forEach(preview=>observer.observe(preview));
}else previews.forEach(preview=>{preview.src=preview.dataset.src;preview.play().catch(()=>{})});
document.querySelectorAll('.poster').forEach(button=>button.addEventListener('click',()=>{
  previews.forEach(preview=>preview.pause());
  document.getElementById('modal-title').textContent=button.dataset.title;
  player.src=button.dataset.src;
  downloadVideo.href=button.dataset.src;
  modal.showModal();
  player.play().catch(()=>{});
}));
modal.querySelector('.modal-close').addEventListener('click',()=>modal.close());
modal.addEventListener('click',event=>{if(event.target===modal)modal.close()});
modal.addEventListener('close',()=>{
  player.pause();player.removeAttribute('src');player.load();
  previews.filter(preview=>preview.dataset.visible==='1').forEach(preview=>preview.play().catch(()=>{}));
});
</script>
